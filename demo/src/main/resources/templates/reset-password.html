<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - EndoPrev</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.png"/>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>

<body class="password-page">
    <header class="header header-simple">
      <div class="header-inner">
        <a class="logo" href="index.html">
          <img class="logo-img" src="img/logo.png" alt="EndoPrév"/>
          <div class="logo-texts">
            <span class="logo-text"><span class="logo-endo">Endo</span><span class="logo-prev">Prév</span></span>
            <span class="logo-tagline">— Prévenir l'Endométriose —</span>
          </div>
        </a>
      </div>
    </header>

    <section class="password-card">
        <form class="password-form" id="resetPasswordForm">
            <h2 class="password-title">Réinitialiser le mot de passe</h2>
            <p class="password-subtitle">Choisissez un nouveau mot de passe pour votre compte EndoPrév.</p>
            <input id="token" type="hidden" th:value="${token}">
            <div class="password-inputbox">
                <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
                <input id="password" name="password" type="password" minlength="8" required placeholder="Nouveau mot de passe">
                <label for="password">Nouveau mot de passe</label>
            </div>
            <div class="password-inputbox">
                <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" required placeholder="Confirmer le mot de passe">
                <label for="confirmPassword">Confirmer le mot de passe</label>
            </div>
            <p id="resetPasswordMessage" class="password-message" role="alert" aria-live="polite"></p>
            <button class="password-submit" type="submit">Réinitialiser le mot de passe</button>
            <div class="password-footer">
                <p>Vous préférez revenir en arrière ? <a href="login.html">Retour à la connexion</a></p>
            </div>
        </form>
    </section>
    <script src="/js/reset-password.js"></script>
</body>
</html>
