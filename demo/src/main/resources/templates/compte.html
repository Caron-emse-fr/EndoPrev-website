<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon Compte — EndoPrév</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="index.html">
      <img class="logo-img" src="img/logo.png" alt="EndoPrév"/>
      <div class="logo-texts">
        <span class="logo-text"><span class="logo-endo">Endo</span><span class="logo-prev">Prév</span></span>
        <span class="logo-tagline">— Prévenir l'Endométriose —</span>
      </div>
    </a>
    <nav class="main-nav">
      <a class="main-tab" href="patientes.html" style="text-decoration:none">🌸 Patientes</a>
      <a class="main-tab" href="chercheures.html" style="text-decoration:none">🔬 Chercheur·es</a>
      <a class="main-tab" href="associations.html" style="text-decoration:none">🤝 Associations</a>
      <a class="main-tab" href="temoignages.html" style="text-decoration:none">💬 Témoignages</a>
      <a class="main-tab" href="qui-sommes-nous.html" style="text-decoration:none">👥 Qui sommes-nous</a>
    </nav>
    <div class="header-right">
      <a class="login-btn" href="/compte" style="text-decoration:none">👤 Compte</a>
    </div>
  </div>
</header>

<main class="endo-root">
  <section class="section content-area visible">
    <div class="info-banner">
      <span class="info-banner-icon">👤</span>
      <div class="info-banner-text">
        <strong>Mon Espace Personnel</strong><br>
        Bienvenue sur votre compte, <span style="font-weight:700; color:var(--primary-color);" th:text="${username}">Utilisateur</span> !
      </div>
    </div>

    <div class="modal" style="position: relative; max-width: 650px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
      <div class="modal-header" style="margin-bottom: 1.5rem;">
        <div>
          <div class="modal-title" style="font-size: 1.25rem; font-weight: 600;">Paramètres du compte</div>
          <div class="modal-subtitle" style="font-size: 0.85rem; color: #666;">Mettez à jour vos informations de santé et profil</div>
        </div>
      </div>

      <form th:action="@{/compte/update}" method="POST">
        <!-- Nom d'utilisateur Spring Security -->
        <div class="form-row" style="margin-bottom: 1rem;">
          <label class="form-label" style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Nom d'utilisateur</label>
          <input class="form-input" type="text" th:value="${username}" disabled style="background-color: #f5f5f5; width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px;"/>
        </div>

        <!-- Email -->
        <div class="form-row" style="margin-bottom: 1rem;">
          <label class="form-label" style="display: block; font-weight: 500; margin-bottom: 0.3rem;">Email</label>
          <input class="form-input" type="email" th:value="${user != null ? user.email : ''}" disabled style="background-color: #f5f5f5; width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px;"/>
        </div>

        <!-- Âge -->
        <div class="form-row" style="margin-bottom: 1rem;">
          <label class="form-label" style="display: block; font-weight: 500; margin-bottom: 0.3rem;" for="age">Votre âge</label>
          <input class="form-input" type="number" id="age" name="age" min="10" max="120" placeholder="Ex: 28" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px;"/>
        </div>

        <!-- Genre -->
        <div class="form-row" style="margin-bottom: 1rem;">
          <label class="form-label" style="display: block; font-weight: 500; margin-bottom: 0.3rem;" for="genre">Genre</label>
          <select class="form-select" id="genre" name="genre" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; background: #fff;">
            <option value="">Sélectionnez...</option>
            <option value="F">F (Féminin)</option>
            <option value="M">M (Masculin)</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <!-- Atteinte d'endométriose -->
        <div class="form-row" style="margin-bottom: 1.5rem;">
          <label class="form-label" style="display: block; font-weight: 500; margin-bottom: 0.3rem;" for="endometriose">Atteinte d'endométriose ?</label>
          <select class="form-select" id="endometriose" name="endometriose" style="width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; background: #fff;">
            <option value="">Sélectionnez...</option>
            <option value="oui-confirme">Oui, diagnostic confirmé</option>
            <option value="en-cours">En cours de diagnostic / suspicion</option>
            <option value="non">Non</option>
            <option value="autre">Ne souhaite pas répondre / Proche concerné·e</option>
          </select>
        </div>

        <button type="submit" class="submit-btn" style="width: 100%; padding: 0.75rem; background-color: #d81b60; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">💾 Enregistrer les modifications</button>
      </form>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
