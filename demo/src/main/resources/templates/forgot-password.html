<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - EndoPrev</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/logo.png"/>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>

<body class="password-page">
    <header class="header header-simple">
      <div class="header-inner">
        <a class="logo" href="index.html">
          <img class="logo-img" src="img/logo.png" alt="EndoPrév"/>
          <div class="logo-texts">
            <span class="logo-text"><span class="logo-endo">Endo</span><span class="logo-prev">Prév</span></span>
            <span class="logo-tagline">— Prévenir l'Endométriose —</span>
          </div>
        </a>
      </div>
    </header>

    <section class="password-card">
        <form class="password-form" id="forgotPasswordForm">
            <h2 class="password-title">Mot de passe oublié</h2>
            <p class="password-subtitle">Saisissez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>
            <div class="password-inputbox">
                <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
                <input id="email" name="email" type="email" required placeholder="Adresse e-mail">
            </div>
            <p id="forgotPasswordMessage" class="password-message" role="alert" aria-live="polite"></p>
            <button class="password-submit" type="submit">Envoyer le lien</button>
            <div class="password-footer">
                <p>Vous vous souvenez de votre mot de passe ? <a href="login.html">Connectez-vous</a></p>
            </div>
        </form>
    </section>
    <script src="/js/forgot-password.js"></script>
</body>
</html>
